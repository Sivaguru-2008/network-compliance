#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0
# Fortinet FortiOS configuration.
#
# No deterministic parser in this tool understands this syntax, so it is the
# worked example for the LLM fallback:
#     python -m auditor samples/fortios_unknown.conf --allow-llm
#
# Its posture is deliberately weak in the same places as the other samples:
# telnet and HTTP administrative access are permitted, the SNMP community is a
# default name, and the idle timeout is long.
config system global
    set admin-concentrator-mode disable
    set admin-console-timeout 0
    set admin-sport 443
    set admin-ssh-port 22
    set admintimeout 480
    set hostname "BRANCH-FGT-11"
    set timezone "Asia/Kolkata"
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.20 255.255.255.248
        set allowaccess ping https http ssh telnet
        set type physical
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2Xk2mR7vQpLb3NcJsEuA4iKmPnVxCbGyRt8rTfYh1WqZd6
    next
end
config system snmp sysinfo
    set status enable
    set contact-info "netops@example.net"
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 192.168.20.50 255.255.255.255
            next
        end
        set query-v1-status enable
        set query-v2c-status enable
    next
end
config log syslogd setting
    set status enable
    set server "192.168.20.40"
    set port 514
end
config system ntp
    set ntpsync enable
end
