firmware-version SonicOS 7.0.1-5030

hostname SWFW-INSECURE

administration
  web-management https-port 443
  web-management allow-http
  admin idle-timeout 60
  exit

interface X0
  management https
  management http
  management ssh
  management snmp
  management ping
  ip 192.168.1.1 255.255.255.0
  exit

interface X1
