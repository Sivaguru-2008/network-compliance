# SYNTHETIC FIXTURE — constructed from verified SonicWall E-CLI documentation.
# NOT a genuine device export. SonicOS version: 7.x.
#
# This configuration has partial or ambiguous security settings
# where the compliance posture cannot be conclusively determined.

firmware-version SonicOS 7.0.0-5000

hostname SWFW-PARTIAL

administration
  web-management https-port 443
  admin idle-timeout 15
  exit

interface X0
  management https
  management ssh
  no management http
  ip 192.168.1.1 255.255.255.0
  exit

snmp
  snmp enable
  snmp community-name custom-ro-string
  exit

log
  syslog-server 10.10.10.50 port 514 facility local0
  exit

user-management
  user admin group Administrators
  exit

end
