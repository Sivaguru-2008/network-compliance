# ==============================================================================
# SOURCE: SonicWall SonicOS/X 7 CLI Reference Guide & SonicOS 6.5 E-CLI Guide
# SOURCE FILE: Official SonicWall Technical Documentation Examples
# CLASSIFICATION: OFFICIAL_SONICWALL_EXAMPLE
# REAL DEVICE: NO (Official Documentation Example)
# VERSION: SonicOS 7.0 / 6.5
# ==============================================================================
firmware-version SonicOS 7.0.1-5050
hostname SONICWALL-OFFICIAL-DOC-EXAMPLE
administration
  web-management https-port 443
  no web-management allow-http
  admin idle-timeout 10
  password-min-length 14
  password-complexity alphanumeric-symbolic
  login-attempts-per-minute 3
  lockout-period 30
  max-cli-login-attempts 3
  enhanced-audit-logging enable
  pre-login-banner "SonicOS Authorized System Notice"
  exit
interface X0
  management https
  management ssh
  no management http
  no management snmp
  management ping
  ip 192.168.168.168 255.255.255.0
  exit
interface X1
  no management https
  no management http
  no management ssh
  no management snmp
  no management ping
  ip 203.0.113.1 255.255.255.0
  exit
snmp
  no snmp enable
  exit
log
  syslog-server 10.0.0.50 port 514 facility local0
  syslog-server 10.0.0.51 port 514 facility local0
  syslog-format enhanced
  exit
ntp
  ntp-server 10.0.0.123
  ntp-server 10.0.0.124
  exit
security-services
  gateway-anti-virus enable
  intrusion-prevention enable
  anti-spyware enable
  exit
end
