# EXTERNAL VALIDATION DATA (SYNTHETIC FIXTURE)
# Formatted according to Stormshield SNS configuration backup archive (.na / INI format).
# Reference: Stormshield Technical Documentation (SNS INI configuration structure).

[Global]
Hostname=SNS-BRANCH-01
DNS=192.168.1.1,192.168.1.2
Timezone=Europe/Paris

[Console]
SSH=1
Port=22
Timeout=600
AdminNetwork=192.168.1.0/24

[Webadmin]
State=1
Port=443
AllowHTTP=0
Timeout=600
AdminNetwork=192.168.1.0/24
Bruteforce=1
BruteforceMaxAttempts=5
BruteforceTime=300

[PasswordPolicy]
MinLength=14
MinComplexity=1
MaxAgeDays=90

[Auth]
Method=radius,ldap
RadiusServer=192.168.1.50

[Banner]
BannerState=1
BannerText=Authorized access only. Violators will be prosecuted.

[SNMP]
State=1
Community=branch_monitor
CommunityAccess=ro

[NTP]
State=1
Server=192.168.1.10,192.168.1.11

[Log]
SyslogState=1
SyslogServer=192.168.1.250
LocalBuffer=1

[HA]
State=1
