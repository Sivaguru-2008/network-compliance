# OFFICIAL VENDOR EXAMPLE (SYNTHETIC DERIVATION)
# Constructed directly from Stormshield SNS CLI / Serverd Commands Reference Guide examples.
# Reference: documentation.stormshield.eu/SNS/v4/en/

# Stormshield Network Security v4.8.1
# Model: SN3100
# Serial: SN3100A0011223344

CONFIG HOSTNAME name="SNS-HQ-CORP-01"

CONFIG CONSOLE SSH state=1 port=22
CONFIG CONSOLE TIMEOUT timeout=10m
CONFIG CONSOLE ACCESS ADD ip="10.0.0.0/8"

CONFIG WEBADMIN state=1 port=443 allowhttp=0
CONFIG WEBADMIN IDLETIMEOUT timeout=10m
CONFIG WEBADMIN ACCESS ADD ip="10.0.0.0/8"
CONFIG WEBADMIN BRUTEFORCE state=1 nbAttempts=5 time=300 triesTime=30

CONFIG PASSWDPOLICY SET minLength=12 minComplexity=1 maxAge=60

CONFIG AUTH METHOD type=radius server="10.0.0.25"
CONFIG AUTH DEFAULT method=radius

CONFIG SYSTEM BANNER state=1 text="NOTICE: Access restricted to authorized personnel only."

CONFIG LOG SERVER ADD host="10.0.0.200" port=514 type=syslog state=1
CONFIG LOG BUFFER state=1

CONFIG SNMP state=1
CONFIG SNMP COMMUNITY ADD name="corp_snmp_ro" access=ro ip="10.0.0.50"

CONFIG NTP state=1
CONFIG NTP SERVER ADD name="time.nist.gov"
CONFIG NTP SERVER ADD name="time.google.com"

CONFIG DNS SERVER ADD host="10.0.0.1"
CONFIG DNS SERVER ADD host="10.0.0.2"

CONFIG HA state=1
