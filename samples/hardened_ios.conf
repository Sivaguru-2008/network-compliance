!
! Reasonably hardened Cisco IOS configuration - the PASS-side fixture.
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec show-timezone
service password-encryption
!
hostname CORE-RTR-01
!
boot-start-marker
boot-end-marker
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
enable secret 5 $1$mERr$W7C.QBGZ2GPRDTAyfxVMh1
!
username netadmin privilege 15 secret 5 $1$Yb9L$Nc3vBk7Qs1TzZi0pLmA2n.
!
no ip domain-lookup
ip domain-name corp.example.net
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
!
no ip http server
no ip http secure-server
!
interface GigabitEthernet0/0
 description UPLINK-TO-DIST
 ip address 10.10.0.1 255.255.255.252
 no ip proxy-arp
!
interface GigabitEthernet0/1
 description MGMT
 ip address 10.20.30.1 255.255.255.0
 no ip proxy-arp
!
logging buffered 32768 informational
logging trap informational
logging host 10.20.30.40
!
snmp-server community Rt7-K9x2-Vq4mZ RO 99
snmp-server location DC1-RACK12
snmp-server contact netops@corp.example.net
!
access-list 99 remark SNMP-NMS-ONLY
access-list 99 permit 10.20.30.0 0.0.0.255
!
banner login ^C Authorised access only. Activity is monitored. ^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
line aux 0
 no exec
line vty 0 4
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 exec-timeout 10 0
 transport input ssh
!
ntp server 10.20.30.50
!
end
