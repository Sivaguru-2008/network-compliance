! Second snapshot of BRANCH-SW-07, taken after a partial hardening pass.
! Same hostname and vendor as branch-sw-07.conf, different content: the
! inventory flags the pair as possible_config_drift and keeps both.
version 12.4
service timestamps debug uptime
service timestamps log datetime msec
!
hostname BRANCH-SW-07
!
enable password cisco123
!
username admin password 0 admin
!
ip http server
ip http secure-server
!
interface FastEthernet0/0
 description LAN
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface FastEthernet0/1
 description WAN
 ip address 203.0.113.10 255.255.255.248
 no shutdown
!
snmp-server community public RO
snmp-server community private RW
snmp-server host 192.168.1.50 public
!
line con 0
 password cisco
 login
line aux 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 exec-timeout 10 0
 transport input telnet
line vty 5 15
 password cisco
 login
 exec-timeout 10 0
 transport input all
!
end
