# TMSH-VERSION: 16.1.3
sys global-settings {
    hostname bigip01.corp.net
}
sys ntp {
    servers { 10.0.0.1 10.0.0.2 }
    timezone America/New_York
}
sys sshd {
    inactivity-timeout 600
}
sys httpd {
    ssl-ciphersuite DEFAULT:!EXPORT:!DES:!3DES:!MD5:!RC4
}
sys auth password-policy {
    min-duration 1
    min-length 14
    password-memory 5
}
sys syslog {
    remote-servers {
        syslog_server {
            host 10.0.0.100
        }
    }
}