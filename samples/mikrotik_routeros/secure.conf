/interface bridge
add name=bridge-mgmt
/ip address
add address=10.0.1.1/24 interface=bridge-mgmt network=10.0.1.0
/ip dns
set servers=10.0.1.53,10.0.2.53
/ip service
set telnet disabled=yes
set ftp disabled=yes
set www disabled=yes
set ssh address=10.0.1.0/24 port=2222
set api disabled=yes
set winbox address=10.0.1.0/24
set api-ssl disabled=yes
/ip ssh
set strong-crypto=yes host-key-size=4096 forwarding-enabled=no
/snmp
set enabled=yes contact="noc@example.com" location="DC1-Rack42"
/snmp community
set [ find default=yes ] name=s3cur3Str1ng addresses=10.0.1.0/24 security=private read-access=yes write-access=no authentication-protocol=SHA1 encryption-protocol=AES
/system identity
set name=core-rtr-01
/system logging action
set 3 remote=10.0.1.100 remote-port=514
add name=syslog2 target=remote remote=10.0.1.101 remote-port=514
/system logging
add action=remote topics=critical
add action=remote topics=error
add action=remote topics=warning
add action=remote topics=info
/system note
set show-at-login=yes note="Authorized access only. All activity is monitored and logged."
/system ntp client
set enabled=yes
/system ntp client servers
add address=10.0.1.200
add address=10.0.1.201
/tool bandwidth-server
set enabled=no
/tool mac-server
set allowed-interface-list=none
/tool mac-server mac-winbox
set allowed-interface-list=none
/tool mac-server ping
set enabled=no
/user
set [ find default=yes ] disabled=yes
add name=netadmin group=full address=10.0.1.0/24
/user aaa
set use-radius=yes default-group=read
