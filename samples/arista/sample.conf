! Arista EOS sample switch configuration
hostname ARISTA-SW-01
!
service password-encryption
!
security passwords min-length 8
!
enable secret 9 $9$LkBmR7vQpLb3Nc$8rTfYh1WqZd6JsEuA4iKmPnVxCbGyRt
!
aaa new-model
aaa authentication login default local
!
management ssh
   no shutdown
!
ip ssh version 2
!
no ip http server
!
ntp server 10.20.30.41
!
logging host 10.20.30.40
logging buffered 32000 informational
!
snmp-server community public RO
!
banner login
Authorized Access Only. Activity is monitored.
EOF
!
line vty 0 4
   exec-timeout 5 0
   access-class 99 in
   transport input ssh
!
