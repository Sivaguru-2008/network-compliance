## Juniper Junos set-format configuration (show configuration | display set).
## Deterministically parsed by JunosParser: python -m auditor samples/junos_srx.conf
##
## Deliberately mixed posture: SSHv2, syslog and a hashed root credential are
## correct; telnet, J-Web over HTTP, default SNMP communities, no idle timeout
## and local-only authentication are not.
##
set version 21.4R3-S4.9
set system host-name BRANCH-FW-02
set system domain-name branch.example.net
set system root-authentication encrypted-password "$6$mR7vQpLb$8rTfYh1WqZd6JsEuA4iKmPnVxCbGyRt3pLhBc7YrUeIoAtFgNjW"
set system login user netops class super-user
set system login user netops authentication encrypted-password "$6$Qw8sT2nM$3pLhBc7YrUeIoAtFgNjWqZmSxDvHkRy1WqZd6JsEuA4iKmPnVxC"
set system login message "Authorised access only. Activity is logged and monitored."
set system login idle-timeout 0
set system services telnet
set system services ssh protocol-version v2
set system services ssh root-login deny
set system services web-management http interface ge-0/0/0.0
set system services web-management https system-generated-certificate
set system syslog host 10.20.30.40 any notice
set system syslog file messages any notice
set system ntp server 10.20.30.41
set snmp community public authorization read-only
set snmp community private authorization read-write
set snmp trap-group space targets 10.20.30.40
set interfaces ge-0/0/0 unit 0 family inet address 10.10.0.1/30
set interfaces ge-0/0/1 unit 0 family inet address 10.20.0.1/24
set routing-options static route 0.0.0.0/0 next-hop 10.10.0.2
set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone untrust interfaces ge-0/0/0.0
