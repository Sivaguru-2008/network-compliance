!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname campus-core-rtr01
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
logging host 198.51.100.50
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
enable secret 9 <SANITIZED_SECRET>
username netadmin privilege 15 secret 9 $9$091238hf9a8hfa0982h3fa098...
!
no ip domain lookup
ip domain name enterprise.stanford.edu
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip icmp rate-limit unreachable
ip cef
!
interface Loopback0
 description MGMT_LOOPBACK
 ip address 10.255.0.1 255.255.255.255
 no ip proxy-arp
 no ip redirects
!
interface GigabitEthernet0/0/0
 description UPLINK-TO-INTERNET2
 ip address 198.51.100.2 255.255.255.252
 ip access-group INGRESS_EDGE in
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
snmp-server community <SANITIZED_COMMUNITY> RO 99
snmp-server host 198.51.100.50 version 2c readOnlyComm
!
ntp server 198.51.100.123 prefer
ntp authenticate
!
banner motd ^C
=====================================================
UNAUTHORIZED ACCESS TO THIS SYSTEM IS STRICTLY PROHIBITED
ALL ACTIVITIES ARE MONITORED AND LOGGED.
=====================================================
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 access-class 99 in
 logging synchronous
!
ip access-list standard 99
 permit 10.0.0.0 0.255.255.255
 permit 198.51.100.0 0.0.0.255
 deny any log
!
end
