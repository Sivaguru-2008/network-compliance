! device: sw-branch-02 (DCS-7010T-48, EOS-4.21.3F)
!
hostname sw-branch-02
!
enable password <SANITIZED_ENABLE_PASSWORD>
!
management ssh
   idle-timeout 0
   no shutdown
!
management telnet
   no shutdown
!
management api http-commands
   no shutdown
   protocol http
   protocol https
!
snmp-server community <SANITIZED_SNMP_COMMUNITY> ro
snmp-server community <SANITIZED_SNMP_COMMUNITY> rw
!
interface Ethernet1
   no shutdown
!
end
