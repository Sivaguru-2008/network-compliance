#
# Huawei VRP - a vendor no deterministic parser in this tool understands.
#
# This is what the LLM fallback exists for:
#     python -m auditor samples/unknown_vendor.conf --allow-llm
#
# Cisco IOS, Junos and FortiOS all score this below the selection threshold,
# so the registry refuses to guess and the fallback has to be asked for.
#
!Software Version V200R010C00SPC600
#
sysname BRANCH-SW-03
#
clock timezone IST add 05:30:00
#
info-center enable
info-center loghost 10.30.40.50
#
undo telnet server enable
stelnet server enable
#
aaa
 local-user netops password irreversible-cipher <SANITIZED_SECRET>
 local-user netops privilege level 15
 local-user netops service-type ssh terminal
#
ssh user netops authentication-type password
ssh user netops service-type stelnet
#
snmp-agent
snmp-agent community read cipher <SANITIZED_SECRET>
snmp-agent sys-info version v2c v3
#
ntp-service unicast-server 10.30.40.41
#
vlan batch 10 20
#
interface Vlanif10
 ip address 10.30.10.1 255.255.255.0
#
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 10
#
interface GigabitEthernet0/0/2
 port link-type trunk
 port trunk allow-pass vlan 10 20
#
user-interface con 0
 authentication-mode aaa
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 30 0
#
return
