# SYNTHETIC FIXTURE — constructed from verified Stormshield Network Security CLI documentation.
# NOT a genuine device export. SNS version: 4.8.x LTSB / 5.x.
# Reference: Stormshield Technical Documentation (documentation.stormshield.eu)
# Ref: Stormshield SNS CLI / Serverd Commands Reference Guide & Hardening Guide.
#
# This configuration represents a fully hardened Stormshield firewall appliance.

# Stormshield Network Security v4.8.2
# Model: SN510
# Serial: SN510A0012345678

CONFIG HOSTNAME name="SNS-SECURE-GW01"

CONFIG CONSOLE SSH state=1 port=22
CONFIG CONSOLE TIMEOUT timeout=600
CONFIG CONSOLE ACCESS ADD ip="192.168.10.0/24"

CONFIG WEBADMIN state=1 port=443 allowhttp=0
CONFIG WEBADMIN TIMEOUT timeout=600
CONFIG WEBADMIN ACCESS ADD ip="192.168.10.0/24"
CONFIG WEBADMIN BRUTEFORCE state=1 nbAttempts=3 time=300 triesTime=60

CONFIG PASSWDPOLICY SET minLength=16 minComplexity=1 maxAge=90

CONFIG AUTH RADIUS ADD host="10.10.10.50" secret="RadiusSharedKey123"
CONFIG AUTH DEFAULT method=radius

CONFIG BANNER state=1 prelogin="Authorized access only. All activities are monitored and recorded."

CONFIG LOG state=1 buffer=1
CONFIG LOG SERVER ADD host="10.10.10.200" port=514 type=syslog state=1
CONFIG LOG SERVER ADD host="10.10.10.201" port=514 type=syslog state=1

CONFIG SNMP state=1
CONFIG SNMP COMMUNITY ADD name="SecMon2026" access=ro ip="10.10.10.100"

CONFIG NTP state=1
CONFIG NTP SERVER ADD name="10.10.10.123"
CONFIG NTP SERVER ADD name="10.10.10.124"

CONFIG DNS SERVER ADD host="10.10.10.1"
CONFIG DNS SERVER ADD host="10.10.10.2"

CONFIG HA state=1
