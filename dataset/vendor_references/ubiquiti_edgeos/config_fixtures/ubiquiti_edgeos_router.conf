system {
    host-name Ubiquiti-EdgeRouter-Pro
    login {
        user admin {
            authentication {
                encrypted-password "<SANITIZED_SECRET>"
            }
            level admin
        }
    }
    ntp {
        server 0.ubnt.pool.ntp.org {
        }
    }
    syslog {
        global {
            facility all {
                level notice
            }
            facility protocols {
                level debug
            }
        }
        host 192.168.1.50 {
            facility all {
                level info
            }
        }
    }
    services {
        ssh {
            protocol-version v2
            port 22
        }
        gui {
            http-port 0
            https-port 443
        }
    }
}
