! Cisco Adaptive Security Appliance Version 9.16(2)
hostname ASA-CORE-01
domain-name company.local
names
clock timezone UTC 0 0
aaa authentication ssh console LOCAL
aaa authentication http console LOCAL
ssh version 2
ssh timeout 10
ssh 10.0.0.0 255.255.0.0 inside
no http server enable
http server enable
http 10.0.0.0 255.255.0.0 inside
logging enable
logging host inside 10.0.0.50
ntp server 10.0.0.1
enable password <SANITIZED_ENABLE_PASSWORD> encrypted
passwd localadmin password $6$xyz$abc encrypted
banner motd Authorized Access Only