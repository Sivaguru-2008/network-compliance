/* VersaOS 21.2 */
system {
    host-name Versa-SDWAN-01
    time-zone UTC
    ntp {
        server 10.0.0.1;
    }
    services {
        ssh {
            enable;
            protocol-version v2;
        }
        https {
            enable;
        }
        telnet {
            disable;
        }
    }
    logging {
        remote 10.0.0.100;
    }
}