! Reasonably hardened Cisco IOS running-config
! Expected result against the CIS pack: 8 PASS, 0 FAIL, 0 NEEDS_REVIEW
!
version 15.7
service timestamps debug datetime msec show-timezone
service timestamps log datetime msec show-timezone
service password-encryption
!
security passwords min-length 8
!
hostname CORE-RTR-01
!
boot-start-marker
boot-end-marker
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting commands 15 default start-stop group tacacs+
!
enable secret 9 <SANITIZED_ENABLE_SECRET>
!
username netadmin privilege 15 secret 9 $9$Qw8sT2nMzXv5Kd$3pLhBc7YrUeIoAtFgNjWqZmSxDvHkRy
!
no ip domain lookup
ip domain name corp.example.net
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
no ip http secure-server
!
no ip bootp server
no service pad
no cdp run
!
interface Loopback0
 description MANAGEMENT
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description UPLINK-TO-DIST
 ip address 10.10.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description USER-ACCESS
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
logging buffered 64000 informational
logging trap informational
logging source-interface Loopback0
logging host 10.20.30.40
!
access-list 99 remark NMS-AND-JUMP-HOSTS
access-list 99 permit 10.20.30.0 0.0.0.255
!
snmp-server community <SANITIZED_SNMP_COMMUNITY> RO 99
snmp-server host 10.20.30.40 version 2c Str0ng-R0-C0mmun1ty
snmp-server enable traps snmp authentication coldstart warmstart
!
banner login ^C
Authorised access only. Activity is logged and monitored.
^C
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport input none
line aux 0
 no exec
 transport input none
line vty 0 4
 exec-timeout 5 0
 login authentication default
 access-class 99 in
 transport input ssh
line vty 5 15
 exec-timeout 5 0
 login authentication default
 access-class 99 in
 transport input ssh
!
ntp server 10.20.30.41
!
end
