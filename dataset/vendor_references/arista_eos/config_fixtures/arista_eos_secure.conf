! device: sw-core-01 (DCS-7050SX3-48YC12, EOS-4.28.0F)
!
hostname sw-core-01
!
aaa authentication login default local
!
enable secret sha512 $6$rounds=656000$salt$longhashvalue
!
service password-encryption
!
security password minimum-length 8
!
management ssh
   idle-timeout 10
   no shutdown
   ip access-group MGMT-ACL in
!
management telnet
   shutdown
!
management api http-commands
   no shutdown
   protocol https
   no protocol http
!
management console
   idle-timeout 10
!
snmp-server community <SANITIZED_SNMP_COMMUNITY> ro MGMT-ACL
!
logging host 10.1.1.100
logging buffered 50000
!
ntp server 10.1.1.10
ntp server 10.1.1.11
!
banner login
Authorized access only. All activity is monitored.
EOF
!
ip access-list MGMT-ACL
   10 permit ip 10.0.0.0/24 any
!
interface Ethernet1
   no shutdown
!
interface Management1
   ip address 10.0.0.1/24
!
vrf instance MGMT
!
end
