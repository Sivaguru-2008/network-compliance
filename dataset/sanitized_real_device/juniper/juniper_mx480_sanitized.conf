## Junos OS Sanitized Live Router Dump
version 20.4R3.8;
system {
    host-name junper-edge-mx480;
    domain-name datacenter.juniper.net;
    authentication-order [ tacplus password ];
    root-authentication {
        encrypted-password "<SANITIZED_SECRET>"; ## SECRET-DATA
    }
    services {
        ssh {
            protocol-version v2;
            rate-limit 5;
            connection-limit 10;
        }
        web-management {
            https {
                system-generated-certificate;
            }
        }
    }
    login {
        message "AUTHORIZED USERS ONLY. ALL SESSIONS MONITORED.";
        class super-user-local {
            permissions all;
        }
        user admin {
            uid 2001;
            class super-user-local;
            authentication {
                encrypted-password "<SANITIZED_SECRET>"; ## SECRET-DATA
            }
        }
    }
    syslog {
        user * {
            any emergency;
        }
        host 192.0.2.50 {
            any info;
            facility-override local0;
        }
    }
    ntp {
        server 192.0.2.1 prefer;
    }
}
snmp {
    community "<SANITIZED_COMMUNITY>"
        authorization read-only;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                filter {
                    input RE_PROTECT;
                }
                address 198.51.100.1/30;
            }
        }
    }
}
