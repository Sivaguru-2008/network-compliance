!
version 15.6
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname border-gw-rtr02
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username opsadmin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
enable secret 5 <SANITIZED_SECRET>
!
ip ssh version 2
ip ssh time-out 30
no ip http server
ip http secure-server
!
interface GigabitEthernet0/1
 description WAN_GATEWAY
 ip address 203.0.113.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
!
snmp-server community <SANITIZED_COMMUNITY> RO
snmp-server enable traps
!
ntp server 203.0.113.254
!
line vty 0 4
 transport input ssh
 exec-timeout 15 0
!
end
