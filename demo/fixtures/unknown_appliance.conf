# Demo: Unknown vendor appliance — triggers unknown-vendor path
# This is a fictional vendor to demonstrate the tool's behavior
# when no deterministic parser exists for the configuration format.
appliance-name MYSTERY-FW-01
security-zone trust
  interface eth0
  interface eth1
security-zone untrust
  interface eth2
firewall policy 1
  source trust destination untrust action permit
management ssh enable
management https enable port 8443
logging server 10.3.3.100
ntp server 10.3.3.200
