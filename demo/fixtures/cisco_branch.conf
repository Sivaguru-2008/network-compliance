! Demo: Cisco IOS branch router — mixed security posture
version 15.7
hostname BRANCH-RTR-01
!
enable secret 9 $9$demo_hash_placeholder
!
aaa new-model
aaa authentication login default local
!
ip ssh version 2
!
no logging buffered
no ntp server 10.0.0.1
!
snmp-server community public RO
!
line vty 0 4
 transport input ssh
 exec-timeout 5 0
