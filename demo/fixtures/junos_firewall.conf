## Demo: Juniper Junos SRX firewall — hardened posture
set system host-name SRX-FW-01
set system root-authentication encrypted-password "$6$demo_hash"
set system services ssh protocol-version v2
set system services ssh root-login deny
set system syslog host 10.1.1.100 any warning
set system ntp server 10.1.1.200
set system login idle-timeout 5
