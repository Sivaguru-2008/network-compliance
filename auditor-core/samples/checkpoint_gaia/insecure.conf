# Check Point Gaia configuration - show configuration output
# Insecure sample for testing
set hostname INSECURE-GW
set domainname example.com
set timezone America / New_York
set dns primary 8.8.8.8
set dns secondary 8.8.4.4
set dns suffix example.com
set ntp active on
set ntp server primary 10.0.0.1 version 4
set password-controls min-password-length 4
set password-controls complexity 1
set password-controls palindrome-check off
set password-controls history-checking off
set password-controls history-length 1
set password-controls password-expiration never
set password-controls deny-on-fail enable off
set password-controls deny-on-nonuse enable off
set password-controls password-hash-type SHA256
set inactivity-timeout 720
set message banner off
set message motd off
set snmp agent on
set snmp agent-version any
set snmp community public read-only
set snmp community private read-write
set snmp contact "Admin"
set snmp location "Server Room"
set web ssl-port 443
set web session-timeout 30
