# Check Point Gaia configuration - show configuration output
# Hardened sample for testing
set hostname SECURE-GW-01
set domainname securecorp.internal
set timezone Europe / London
set dns primary 10.10.1.53
set dns secondary 10.10.2.53
set dns suffix securecorp.internal
set ntp active on
set ntp server primary 10.10.1.123 version 4
set ntp server secondary 10.10.2.123 version 4
set password-controls min-password-length 12
set password-controls complexity 4
set password-controls palindrome-check on
set password-controls history-checking on
set password-controls history-length 12
set password-controls password-expiration 90
set password-controls expiration-warning-days 14
set password-controls deny-on-fail enable on
set password-controls deny-on-fail failures-allowed 3
set password-controls deny-on-fail allow-after 1800
set password-controls deny-on-nonuse enable on
set password-controls deny-on-nonuse allowed-days 60
set password-controls password-hash-type SHA512
set inactivity-timeout 10
set message banner on msgvalue "Authorized access only. All activity is monitored."
set message motd on msgvalue "Welcome to SECURE-GW-01. Unauthorized access is prohibited."
set snmp agent on
set snmp agent-version v3-Only
set snmp contact "Security Team <security@securecorp.internal>"
set snmp location "Primary DC Rack A12"
add syslog log-remote-address 10.10.5.10 level info
add syslog log-remote-address 10.10.5.11 level info
set syslog cplogs on
set syslog mgmtauditlogs on
set syslog auditlog permanent
set web ssl-port 4434
set web session-timeout 10
add aaa radius-servers priority 1 host 10.10.3.50 secret "shared_key_1" timeout 5
add aaa radius-servers priority 2 host 10.10.3.51 secret "shared_key_2" timeout 5
