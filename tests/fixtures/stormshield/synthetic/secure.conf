CONFIG HOSTNAME name="SNS-SECURE-GW01"
CONFIG CONSOLE SSH state=1 port=22
CONFIG CONSOLE TIMEOUT timeout=600
CONFIG CONSOLE ACCESS ADD ip="192.168.10.0/24"
CONFIG WEBADMIN state=1 port=443 allowhttp=0
